# ===========================================================================
# quality.yaml --- data quality thresholds (spec Sec 11.2)
#
# WHY A SEPARATE FILE: universe.yaml is now GENERATED by
# scripts/build_dataset.py, so anything hand-written there would be wiped on
# the next rebuild. Quality thresholds are hand-set judgement calls and need a
# file the generator never touches.
#
# EVERY threshold here decides what gets FLAGGED, never what gets deleted.
# The engine returns issues; a human decides what to do about them.
# ===========================================================================

# --- Trading-session inference ---------------------------------------------
# There is no authoritative NSE holiday calendar available offline, so the
# session calendar is inferred from the panel itself. A date counts as a real
# session when at least `session_quorum` of the tickers LISTED at that time
# have a bar on it.
#
# Using the union of all dates instead would let a single ticker with one
# spurious print invent a session for the whole universe, and every other
# ticker would then show a phantom "missing day".
session_quorum: 0.50

# A date carried by fewer than this many tickers is almost certainly a bad
# print rather than a half-day session, and is reported as such.
phantom_date_max_tickers: 5

# --- Price movement (spec Sec 11.2) ----------------------------------------
# "add a data-quality test that flags any single-day move beyond, say, 20%
#  for manual inspection. You will find real ones, and you will find corporate
#  actions your data source handled badly. Both are worth knowing about."
extreme_move_pct: 0.20     # flag for inspection
severe_move_pct: 0.50      # a move this large is a data error until proven otherwise

# Window (in trading days, either side) in which a reported dividend or split
# is treated as a possible explanation for a flagged move.
corporate_action_window_days: 3

# --- Gaps and coverage ------------------------------------------------------
# A gap is a run of consecutive sessions on which a LISTED ticker has no bar.
max_gap_sessions: 5            # longer than this needs eyes on it
min_coverage_over_life: 0.95   # per-ticker observed fraction of its own listed life

# --- Volume -----------------------------------------------------------------
# A single zero-volume day is usually a halt. A run of them means the name was
# effectively untradeable, and any spread built on it in that window is
# fiction regardless of what the price column says.
max_zero_volume_run: 3
zero_volume_frac_warn: 0.02    # >2% of a ticker's life at zero volume

# --- Stale prices -----------------------------------------------------------
# An unchanged close for several sessions reads to an ADF test as an
# exceptionally well-behaved spread. This is the quiet way a suspended stock
# manufactures a false cointegration result, so it is checked explicitly.
max_stale_price_run: 5

# --- Cross-source verification (spec Sec 11.1) ------------------------------
# "Cross-check a few random series against a second source."
cross_check_n_symbols: 5
cross_check_tolerance_pct: 0.02   # 2% on daily closes after aligning adjustments

# --- Report -----------------------------------------------------------------
max_issues_listed_per_check: 25   # full detail always goes to CSV
